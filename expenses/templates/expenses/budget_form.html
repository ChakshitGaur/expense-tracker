{% extends "base.html" %}
{% block title %}Edit budget{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Edit budget</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <div class="form-actions">
      <button>Save</button>
      <a class="btn secondary" href="{% url 'budget_list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
