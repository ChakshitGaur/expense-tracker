{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:500px;margin:auto">
  <h1>Delete expense?</h1>
  <p>{{ object.date }} — {{ object.amount }} {{ object.description }}</p>
  <form method="post">{% csrf_token %}
    <button class="danger">Yes, delete</button>
    <a class="btn secondary" href="{% url 'expense_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
