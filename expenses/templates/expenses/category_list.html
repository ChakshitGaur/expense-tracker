{% extends "base.html" %}
{% block title %}Categories{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;margin:auto">
  <h1>Categories</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button>Add category</button>
  </form>
  <table>
    {% for c in categories %}
      <tr><td>{{ c.name }}</td><td class="num"><a class="btn danger" href="{% url 'category_delete' c.pk %}">Delete</a></td></tr>
    {% empty %}
      <tr><td class="muted">No categories yet.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
