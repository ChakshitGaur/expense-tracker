{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:auto">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button>Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
