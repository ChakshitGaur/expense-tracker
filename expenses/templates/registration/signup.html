{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card narrow" style="margin-top:32px">
  <h1>Create your account</h1>
  <p class="muted" style="margin-top:0">Track expenses, set budgets and see where your money goes.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button style="width:100%">Create account</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
