name: Deploy

# Runs after the Tests workflow passes on main (or by hand), builds the
# production Docker image, checks that it starts and serves pages, and
# publishes it to GitHub Container Registry (ghcr.io).
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Lower-case the image name (registry requirement)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY="$(openssl rand -hex 32)" \
            "$IMAGE:$SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/accounts/login/ > /dev/null; then
              echo "Login page is up"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/accounts/login/ > /dev/null
          # Static files must be served with DEBUG off.
          curl -fsS -o /dev/null "http://localhost:8000$(curl -fsS http://localhost:8000/admin/login/ | grep -o '/static/admin/css/base[^"]*' | head -1)"

      - name: Show container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
